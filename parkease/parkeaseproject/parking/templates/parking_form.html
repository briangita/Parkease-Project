{% extends "base.html" %}
{% block title %}Register Vehicle{% endblock %}

{% block content %}
<div class="container mt-4">
<h3>Register Vehicle</h3>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Save Vehicle</button>
        <a href="{% url 'parking_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
